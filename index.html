<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio bilingue de développement web frontend."
    />
    <meta name="robots" content="index,follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Portfolio" />
    <meta property="og:title" content="Portfolio" />
    <meta
      property="og:description"
      content="Portfolio bilingue de développement web frontend."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Portfolio" />
    <meta
      name="twitter:description"
      content="Portfolio bilingue de développement web frontend."
    />
    <script>
      ;(() => {
        const storageKey = 'portfolio-theme'
        const colorSchemeQuery = '(prefers-color-scheme: dark)'
        const validPreferences = new Set(['light', 'dark'])
        let preference = 'system'

        try {
          const storedPreference = window.localStorage.getItem(storageKey)

          if (validPreferences.has(storedPreference)) {
            preference = storedPreference
          }
        } catch {
          preference = 'system'
        }

        const resolvedTheme =
          preference === 'system'
            ? window.matchMedia(colorSchemeQuery).matches
              ? 'dark'
              : 'light'
            : preference
        const root = document.documentElement

        root.dataset.theme = resolvedTheme
        root.dataset.themePreference = preference
        root.style.colorScheme = resolvedTheme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute(
            'content',
            resolvedTheme === 'dark' ? '#0d111c' : '#f7f8fc',
          )
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
